name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: orders-web-cicd
  ECS_CLUSTER: orders-web-cicd-cluster
  ECS_SERVICE: orders-web-cicd
  TASK_FAMILY: orders-web-cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (build role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_SHA::7}
          IMAGE=$REGISTRY/$ECR_REPOSITORY:$TAG
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          # Resolve the digest so the deploy references content, not a mutable tag
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          echo "Pushed $DIGEST_REF"

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register task revision pinned to the digest
        run: |
          set -euo pipefail
          VERSION=${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition --output json > current.json
          jq --arg image "$IMAGE" --arg version "$VERSION" '
            .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment =
                (((.containerDefinitions[0].environment // []) | map(select(.name != "APP_VERSION")))
                 + [{name: "APP_VERSION", value: $version}])
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' current.json > new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "NEW_TASK_DEF=$NEW_ARN" >> "$GITHUB_ENV"
          echo "Registered $NEW_ARN serving $IMAGE"

      - name: Update service and wait for stability
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          # The circuit breaker can roll back and still report stable, so check what is primary
          PRIMARY=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          if [ "$PRIMARY" != "$NEW_TASK_DEF" ]; then
            echo "::error::Service is on $PRIMARY, not $NEW_TASK_DEF. The circuit breaker rolled back."
            exit 1
          fi

      - name: Health gate through the load balancer
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BODY=""
          for attempt in $(seq 1 18); do
            BODY=$(curl -fsS --max-time 5 "$PRODUCTION_URL/api/health" || true)
            if echo "$BODY" | jq -e --arg v "$VERSION" '.status == "ok" and .version == $v' > /dev/null 2>&1; then
              echo "Healthy: $BODY"
              exit 0
            fi
            echo "Attempt $attempt: not yet serving $VERSION (got: ${BODY:-no response})"
            sleep 10
          done
          echo "::error::Health gate failed for $VERSION. Last response: ${BODY:-none}"
          exit 1
